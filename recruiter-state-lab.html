<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <title>Nova — Recruiter State Lab</title>
  <style>
    :root{color-scheme:light;--ink:#142033;--muted:#657085;--line:#dbe2ec;--surface:rgba(255,255,255,.92);--blue:#246bfd;--bg:#eef3f9}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
    .labbar{height:72px;display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);backdrop-filter:blur(18px);position:relative;z-index:10}
    .labbrand{min-width:210px}.labbrand strong{display:block;font-size:13px;letter-spacing:.03em}.labbrand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .states{display:flex;gap:6px;flex:1;overflow-x:auto}.state-btn,.utility{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 12px;font:600 12px/1 inherit;cursor:pointer;white-space:nowrap}.state-btn:hover,.utility:hover{border-color:#aab8cc}.state-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.utility{border-radius:10px;text-decoration:none}
    .labstatus{font-size:11px;color:var(--muted);min-width:190px;text-align:right}.frame-wrap{height:calc(100% - 72px);position:relative}.frame{width:100%;height:100%;border:0;background:white;display:block}
    .corner-note{position:absolute;right:16px;bottom:16px;z-index:5;background:rgba(20,32,51,.92);color:#fff;border:1px solid rgba(255,255,255,.16);padding:8px 11px;border-radius:10px;font-size:11px;box-shadow:0 10px 30px rgba(20,32,51,.18);pointer-events:none}
    @media(max-width:820px){.labbar{height:auto;min-height:72px;flex-wrap:wrap;gap:8px;padding:9px 10px}.labbrand{min-width:145px}.labstatus{display:none}.states{order:3;flex-basis:100%}.frame-wrap{height:calc(100% - 116px)}.state-btn{padding:8px 10px}}
  </style>
</head>
<body>
  <header class="labbar">
    <div class="labbrand"><strong>NOVA · RECRUITER STATE LAB</strong><span>Prototype dev-tool · simulated product states</span></div>
    <div class="states" role="group" aria-label="Choose prototype state">
      <button class="state-btn" data-state="normal" aria-pressed="false">Normal</button>
      <button class="state-btn" data-state="empty" aria-pressed="false">Empty</button>
      <button class="state-btn" data-state="loading" aria-pressed="false">Loading</button>
      <button class="state-btn" data-state="error" aria-pressed="false">Error</button>
      <button class="state-btn" data-state="edge" aria-pressed="false">Edge case</button>
    </div>
    <div class="labstatus" id="labStatus">Ready</div>
    <a class="utility" href="prototype.html">Prototype index</a>
    <button class="utility" id="copyLink" type="button">Copy state link</button>
  </header>
  <div class="frame-wrap">
    <iframe class="frame" id="productFrame" title="Nova interactive prototype"></iframe>
    <div class="corner-note">State forced for product review · banking remains simulated</div>
  </div>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('productFrame');
  const status = document.getElementById('labStatus');
  const buttons = [...document.querySelectorAll('[data-state]')];
  const routes = {normal:'app.html?screen=home',empty:'app.html?screen=home',loading:'app.html?screen=home',error:'app.html?screen=error',edge:'app.html?screen=home'};
  let activeState = 'normal';
  let loadingTimer = null;

  function injectStyle(doc, css) {
    const style = doc.createElement('style');
    style.dataset.stateLab = 'true';
    style.textContent = css;
    doc.head.appendChild(style);
  }

  function setButtons(state) {
    buttons.forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.state === state)));
  }

  function describe(state) {
    return ({normal:'Normal product data',empty:'First-use · no linked accounts',loading:'Calculating safe-to-spend · 1.2s simulated latency',error:'Transfer revalidation failure · recovery path',edge:'Overcommitted · negative safe-to-spend'}[state] || state);
  }

  function setState(next, updateUrl = true) {
    if (!routes[next]) next = 'normal';
    activeState = next;
    clearTimeout(loadingTimer);
    setButtons(next);
    status.textContent = describe(next);
    if (updateUrl) {
      const url = new URL(location.href);
      url.searchParams.set('state', next);
      history.replaceState({}, '', url);
    }
    frame.src = routes[next] + (routes[next].includes('?') ? '&' : '?') + 'lab=1';
  }

  function applyEmpty(doc) {
    injectStyle(doc, `
      .nova-lab-empty{min-height:290px;display:grid;place-items:center;text-align:center;padding:42px 24px;border:1px dashed #c5d0df;border-radius:24px;background:linear-gradient(180deg,#fbfdff,#f4f8fc)}
      .nova-lab-empty .mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e8f0ff;color:#246bfd;font-weight:800;margin:0 auto 16px}
      .nova-lab-empty h1{font-size:clamp(2rem,4vw,3.7rem);margin:0 0 10px;letter-spacing:-.05em}.nova-lab-empty p{max-width:560px;margin:0 auto;color:#657085;line-height:1.55}.nova-lab-empty button{margin-top:22px;border:0;border-radius:12px;padding:12px 16px;background:#142033;color:#fff;font-weight:700;cursor:pointer}
    `);
    const field = doc.querySelector('.decision-field');
    if (!field) return;
    field.innerHTML = `<div class="nova-lab-empty"><div><div class="mark" aria-hidden="true">+</div><p class="eyebrow">First-use state</p><h1>Safe to spend unavailable</h1><p>No accounts are connected yet, so Nova will not guess a spendable amount. Connect an account to calculate balance, known commitments and protected buffer.</p><button type="button" id="novaDemoAccount">Connect demo account</button></div></div>`;
    const balance = doc.querySelector('.sidebar-account strong'); if (balance) balance.textContent = '—';
    doc.getElementById('novaDemoAccount')?.addEventListener('click', () => setState('normal'));
  }

  function applyLoading(doc) {
    injectStyle(doc, `
      @keyframes novaLabShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      .nova-lab-loading{min-height:330px;padding:34px;border-radius:24px;border:1px solid #dbe2ec;background:#fff}.nova-lab-loading .sk{border-radius:10px;background:linear-gradient(90deg,#edf1f6 25%,#f8fafc 45%,#edf1f6 65%);background-size:220% 100%;animation:novaLabShimmer 1.1s linear infinite}.nova-lab-loading .amount{height:62px;width:min(360px,72%);margin:12px 0}.nova-lab-loading .line{height:14px;width:42%;margin:10px 0}.nova-lab-loading .bar{height:78px;width:100%;margin-top:30px;border-radius:18px}.nova-lab-loading .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.nova-lab-loading .legend .sk{height:48px}.nova-lab-loading p{color:#657085;margin:0}
      @media(prefers-reduced-motion:reduce){.nova-lab-loading .sk{animation:none}}
    `);
    const field = doc.querySelector('.decision-field');
    if (!field) return;
    field.innerHTML = `<section class="nova-lab-loading" aria-busy="true" aria-live="polite"><p class="eyebrow">Recalculating Money Horizon</p><div class="sk amount" aria-hidden="true"></div><div class="sk line" aria-hidden="true"></div><div class="sk line" style="width:58%" aria-hidden="true"></div><div class="sk bar" aria-hidden="true"></div><div class="legend" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><p style="margin-top:20px">Checking balance, future obligations and protected buffer. Simulated network latency: 1.2 seconds.</p></section>`;
    const url = new URL(location.href);
    if (!url.searchParams.has('pin')) loadingTimer = setTimeout(() => { if (activeState === 'loading') setState('normal'); }, 1200);
  }

  function applyEdge(doc) {
    injectStyle(doc, `
      .money-amount.nova-lab-negative{color:#a52d3c;max-width:100%;overflow-wrap:anywhere}.nova-lab-overcommit{margin-top:18px;padding:16px 18px;border:1px solid #e7b9c0;border-radius:16px;background:#fff5f6;color:#6f1f2a}.nova-lab-overcommit strong{display:block;margin-bottom:5px}.nova-lab-overbar{height:54px;border-radius:14px;background:repeating-linear-gradient(135deg,#a52d3c 0 12px,#ba4654 12px 24px);display:flex;align-items:center;padding:0 16px;color:white;font-weight:800;overflow:hidden}.nova-lab-overbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.horizon-legend strong{overflow-wrap:anywhere}
    `);
    const amount = doc.querySelector('.money-amount');
    if (amount) { amount.textContent = '−€8,420.00'; amount.classList.add('nova-lab-negative'); }
    const label = doc.querySelector('.decision-label'); if (label) label.textContent = 'Overcommitted — not safe to spend';
    const copy = doc.querySelector('.decision-copy');
    if (copy) copy.insertAdjacentHTML('beforeend', `<div class="nova-lab-overcommit" role="status"><strong>Future obligations exceed available balance.</strong><span>Large annual tax payment €9,720.00 + known bills leave the 14-day safe-to-spend estimate below zero. Nova keeps the negative value visible instead of clipping it to €0.</span></div>`);
    const bar = doc.querySelector('.horizon-bar');
    if (bar) { bar.innerHTML = `<div class="nova-lab-overbar" style="width:100%"><span>Overcommitted by €8,420.00 · protected buffer preserved</span></div>`; bar.setAttribute('aria-label','Overcommitted by €8,420.00; safe to spend is negative'); }
    const note = doc.querySelector('.horizon-note'); if (note) note.textContent = 'Edge-case simulation: obligations are intentionally extreme to verify negative values, wrapping and recovery messaging without breaking layout.';
  }

  function applyState() {
    const doc = frame.contentDocument;
    if (!doc) return;
    if (activeState === 'empty') applyEmpty(doc);
    if (activeState === 'loading') applyLoading(doc);
    if (activeState === 'edge') applyEdge(doc);
  }

  frame.addEventListener('load', () => requestAnimationFrame(applyState));
  buttons.forEach(btn => btn.addEventListener('click', () => setState(btn.dataset.state)));
  document.getElementById('copyLink').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(location.href); status.textContent = 'State link copied'; }
    catch { status.textContent = 'Copy unavailable · use address bar'; }
  });
  window.addEventListener('message', event => { if (event.origin === location.origin && event.data?.state) setState(event.data.state); });
  const initial = new URL(location.href).searchParams.get('state') || 'normal';
  setState(initial, false);
})();
</script>
</body>
</html>
