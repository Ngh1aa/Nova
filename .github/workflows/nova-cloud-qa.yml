name: Nova Visual QA

on:
  push:
    branches:
      - feat/nova-ios26-redesign
      - a13-factory-dogfood
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nova target
        uses: actions/checkout@v6

      - name: Apply A13 self-contained font remediation
        if: github.event_name == 'push' && github.ref == 'refs/heads/a13-factory-dogfood'
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for raw in ('assets/nova-redesign.css', 'assets/nova-financial-intelligence.css'):
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              filtered = [line for line in lines if 'fonts.googleapis.com' not in line]
              next_text = ''.join(filtered)
              if next_text != text:
                  path.write_text(next_text, encoding='utf-8')
                  changed.append(raw)
          print('A13 font remediation changed:', ', '.join(changed) if changed else 'none')
          PY
          if ! git diff --quiet -- assets/nova-redesign.css assets/nova-financial-intelligence.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/nova-redesign.css assets/nova-financial-intelligence.css
            git commit -m "fix(nova): make primary UI font loading self-contained"
            git push origin HEAD:a13-factory-dogfood
          fi

      - name: Checkout pinned UIUX Factory
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/uiux-ai-workspace
          ref: a9b74f354c485f8b61635755704342205083bb13
          path: .factory

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Factory runtime dependencies
        run: python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"

      - name: Dogfood canonical Flow OS on Nova
        run: |
          mkdir -p .factory/uiux-factory/qa/artifacts
          python .factory/skills_UIUX/scripts/uiux-agent.py \
            --project "$GITHUB_WORKSPACE" \
            --task "Redesign and validate the Nova personal banking interactive prototype across product flows and responsive visual quality" \
            --managed \
            --authority read_only \
            --intent redesign \
            --change-surface PRODUCT \
            --domain financial-services \
            --validation-lane evidence-led \
            --mode interactive-prototype \
            --risk high \
            --feature payments \
            --feature cards \
            --feature savings \
            > .factory/uiux-factory/qa/artifacts/a13-managed-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.factory/uiux-factory/qa/artifacts/a13-managed-plan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('manager_run_id'), 'Factory did not create a managed run'
          assert data.get('active_stage'), 'Factory did not resolve an active stage'
          flow = data.get('flow') or {}
          assert flow.get('id'), 'Factory did not resolve a Flow'
          assert flow.get('stages'), 'Factory resolved an empty Flow'
          assert any(stage.get('skills') for stage in flow['stages']), 'Factory routed no skills to Nova'
          print(f"A13 managed plan: flow={flow['id']} active_stage={data['active_stage']} stages={len(flow['stages'])}")
          PY

      - name: Install Factory QA dependencies
        working-directory: .factory/uiux-factory/qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: .factory/uiux-factory/qa
        run: npx playwright install --with-deps chromium

      - name: Prepare Nova prototype tests
        run: cp qa/nova-flow.spec.mjs .factory/uiux-factory/qa/tests/nova-flow.spec.mjs

      - name: Serve and visually audit Nova product and evidence screens
        working-directory: .factory/uiux-factory/qa
        env:
          QA_TARGET_DIR: ${{ github.workspace }}
          QA_BASE_URL: http://127.0.0.1:4173
          QA_ROUTES: /app.html?screen=home,/app.html?screen=activity,/app.html?screen=transaction-detail,/app.html?screen=cards,/app.html?screen=transfer-review,/app.html?screen=savings,/app.html?screen=kyc,/prototype.html,/design-system.html,/component-states.html,/sitemap.html,/user-flows.html
        run: |
          node scripts/serve-target.mjs > /tmp/nova-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/wait-ready.mjs
          npm test
          npx playwright test tests/nova-flow.spec.mjs

      - name: Print target server log on failure
        if: failure()
        run: cat /tmp/nova-qa-server.log || true

      - name: Upload Nova screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-visual-qa
          path: .factory/uiux-factory/qa/artifacts/
          if-no-files-found: warn
          retention-days: 7
