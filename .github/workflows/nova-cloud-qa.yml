name: Nova Visual QA

on:
  push:
    branches:
      - feat/nova-ios26-redesign
      - a13-factory-dogfood
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nova target
        uses: actions/checkout@v6

      - name: Checkout pinned UIUX Factory
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/uiux-ai-workspace
          ref: 11003bf36909b08c3def617023dc8ecd9c3964fd
          path: .factory

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify generated canonical runtime is in sync
        run: |
          node scripts/p2-1b-consolidate-runtime.mjs
          git diff --check
          git diff --exit-code -- app.html assets/nova-current-renderer.js assets/nova-current.css docs/uiux/runtime-manifest.p2-1b.json

      - name: Install Factory runtime dependencies
        run: python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"

      - name: Dogfood canonical Flow OS on Nova
        run: |
          mkdir -p .factory/uiux-factory/qa/artifacts
          python .factory/skills_UIUX/scripts/uiux-agent.py \
            --project "$GITHUB_WORKSPACE" \
            --task "Redesign and validate the Nova personal banking interactive prototype across product flows and responsive visual quality" \
            --managed \
            --authority read_only \
            --intent redesign \
            --change-surface PRODUCT \
            --domain financial-services \
            --validation-lane evidence-led \
            --mode interactive-prototype \
            --risk high \
            --feature payments \
            --feature cards \
            --feature savings \
            > .factory/uiux-factory/qa/artifacts/a13-managed-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.factory/uiux-factory/qa/artifacts/a13-managed-plan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('manager_run_id'), 'Factory did not create a managed run'
          assert data.get('active_stage'), 'Factory did not resolve an active stage'
          flow = data.get('flow') or {}
          assert flow.get('id'), 'Factory did not resolve a Flow'
          assert flow.get('stages'), 'Factory resolved an empty Flow'
          assert any(stage.get('skills') for stage in flow['stages']), 'Factory routed no skills to Nova'
          print(f"A13 managed plan: flow={flow['id']} active_stage={data['active_stage']} stages={len(flow['stages'])}")
          PY

      - name: Install Factory QA dependencies
        working-directory: .factory/uiux-factory/qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: .factory/uiux-factory/qa
        run: npx playwright install --with-deps chromium

      - name: Prepare Nova prototype tests
        run: |
          cp qa/nova-flow.spec.mjs .factory/uiux-factory/qa/tests/nova-flow.spec.mjs
          cp qa/product-integrity.spec.mjs .factory/uiux-factory/qa/tests/product-integrity.spec.mjs
          cp qa/savings-integrity.spec.mjs .factory/uiux-factory/qa/tests/savings-integrity.spec.mjs
          cp qa/passcode-recovery.spec.mjs .factory/uiux-factory/qa/tests/passcode-recovery.spec.mjs
          cp qa/transfer-impact.spec.mjs .factory/uiux-factory/qa/tests/transfer-impact.spec.mjs
          cp qa/recipient-continuity.spec.mjs .factory/uiux-factory/qa/tests/recipient-continuity.spec.mjs
          cp qa/accessibility-evidence.spec.mjs .factory/uiux-factory/qa/tests/accessibility-evidence.spec.mjs
          cp qa/native-states.spec.mjs .factory/uiux-factory/qa/tests/native-states.spec.mjs
          cp qa/runtime-consolidation.spec.mjs .factory/uiux-factory/qa/tests/runtime-consolidation.spec.mjs
          cp qa/foundation-consolidation.spec.mjs .factory/uiux-factory/qa/tests/foundation-consolidation.spec.mjs
          cp qa/report-boundary.spec.mjs .factory/uiux-factory/qa/tests/report-boundary.spec.mjs
          cp qa/direct-user-round01.spec.mjs .factory/uiux-factory/qa/tests/direct-user-round01.spec.mjs
          cp qa/phase3-clarity.spec.mjs .factory/uiux-factory/qa/tests/phase3-clarity.spec.mjs
          cp qa/identity-source.spec.mjs .factory/uiux-factory/qa/tests/identity-source.spec.mjs

      - name: Serve and visually audit Nova product and evidence screens
        working-directory: .factory/uiux-factory/qa
        env:
          QA_TARGET_DIR: ${{ github.workspace }}
          QA_BASE_URL: http://127.0.0.1:4173
          QA_ROUTES: /app.html?screen=home,/app.html?screen=home&state=empty&pin=1,/app.html?screen=home&state=loading&pin=1,/app.html?screen=home&state=edge&pin=1,/app.html?screen=error,/app.html?screen=activity,/app.html?screen=transaction-detail,/app.html?screen=report-transaction,/app.html?screen=report-transaction&state=handoff,/app.html?screen=cards,/app.html?screen=transfer-recipient,/app.html?screen=transfer-amount,/app.html?screen=transfer-review,/app.html?screen=biometric-failed,/app.html?screen=offline,/app.html?screen=transfer-success,/app.html?screen=savings,/app.html?screen=savings-detail,/app.html?screen=kyc,/recruiter-state-lab.html?state=empty,/state-matrix.html,/prototype.html,/design-system.html,/component-states.html,/sitemap.html,/user-flows.html
        run: |
          node scripts/serve-target.mjs > /tmp/nova-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/wait-ready.mjs
          npm test
          npx playwright test tests/nova-flow.spec.mjs tests/product-integrity.spec.mjs tests/savings-integrity.spec.mjs tests/passcode-recovery.spec.mjs tests/transfer-impact.spec.mjs tests/recipient-continuity.spec.mjs tests/accessibility-evidence.spec.mjs tests/native-states.spec.mjs tests/runtime-consolidation.spec.mjs tests/foundation-consolidation.spec.mjs tests/report-boundary.spec.mjs tests/direct-user-round01.spec.mjs tests/phase3-clarity.spec.mjs tests/identity-source.spec.mjs

      - name: Print target server log on failure
        if: failure()
        run: cat /tmp/nova-qa-server.log || true

      - name: Upload Nova screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-visual-qa
          path: .factory/uiux-factory/qa/artifacts/
          if-no-files-found: warn
          retention-days: 7
