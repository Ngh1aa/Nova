name: NOVA Cloud QA

on:
  push:
    branches:
      - feat/nova-portfolio-grade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOVA target
        uses: actions/checkout@v6

      - name: Checkout pinned UIUX Factory
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/uiux-ai-workspace
          ref: 221370ef294408f3f5a0c6a7fb0567c3db840c3e
          path: .factory

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Factory QA dependencies
        working-directory: .factory/uiux-factory/qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: .factory/uiux-factory/qa
        run: npx playwright install --with-deps chromium

      - name: Prepare NOVA-specific flow tests
        run: cp qa/nova-flow.spec.mjs .factory/uiux-factory/qa/tests/nova-flow.spec.mjs

      - name: Serve and audit NOVA with Factory QA
        working-directory: .factory/uiux-factory/qa
        env:
          QA_TARGET_DIR: ${{ github.workspace }}
          QA_BASE_URL: http://127.0.0.1:4173
          QA_ROUTES: /prototype.html,/app.html?screen=home,/app.html?screen=transaction-detail,/app.html?screen=card-frozen,/app.html?screen=transfer-review,/app.html?screen=transfer-success,/app.html?screen=biometric-failed,/app.html?screen=offline,/app.html?screen=kyc,/design-system.html,/component-states.html,/sitemap.html,/user-flows.html
        run: |
          node scripts/serve-target.mjs > /tmp/nova-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/wait-ready.mjs
          npm test
          npx playwright test tests/nova-flow.spec.mjs
          node scripts/write-lighthouse-config.mjs
          npx lhci autorun --config=lighthouserc.runtime.json

      - name: Print target server log on failure
        if: failure()
        run: cat /tmp/nova-qa-server.log || true

      - name: Upload NOVA QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-cloud-qa-evidence
          path: .factory/uiux-factory/qa/artifacts/
          if-no-files-found: warn
          retention-days: 14
