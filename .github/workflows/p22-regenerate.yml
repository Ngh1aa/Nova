name: P2.2 Regenerate Canonical Runtime

on:
  push:
    branches:
      - refactor/nova-p22-identity-source

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: regenerate P2.2 canonical runtime') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate canonical runtime
        run: node scripts/p2-1b-consolidate-runtime.mjs

      - name: Commit generated outputs
        run: |
          git diff --check
          if git diff --quiet -- app.html assets/nova-current-renderer.js assets/nova-current.css docs/uiux/runtime-manifest.p2-1b.json; then
            echo "Canonical runtime already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html assets/nova-current-renderer.js assets/nova-current.css docs/uiux/runtime-manifest.p2-1b.json
          git commit -m "chore: regenerate P2.2 canonical runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
