name: Round 01 syntax regenerate

on:
  push:
    branches:
      - research/direct-user-round01-iteration

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/direct-user-round01-iteration
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fix source-owner syntax and regenerate canonical runtime
        run: |
          node scripts/fix-round01-template-syntax.mjs
          node scripts/p2-1b-consolidate-runtime.mjs
          git diff --check

      - name: Commit regenerated runtime
        run: |
          if git diff --quiet; then
            echo "No regeneration diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nova.js app.html assets/nova-current-renderer.js assets/nova-current.css docs/uiux/runtime-manifest.p2-1b.json
          git commit -m "fix: repair Round 01 renderer template syntax"
          git push origin HEAD:research/direct-user-round01-iteration
