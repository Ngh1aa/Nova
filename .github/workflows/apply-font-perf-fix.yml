name: Apply NOVA font performance repair

on:
  push:
    branches:
      - fix/nova-lighthouse-stability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/nova-lighthouse-stability

      - name: Remove render-blocking third-party font dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/nova.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(
              r"^@import url\('https://fonts\.googleapis\.com/css2\?[^']+'\);\s*",
              "",
              css,
              count=1,
          )
          css = css.replace(
              '--serif:"Source Serif 4",Georgia,"Times New Roman",serif;',
              '--serif:Georgia,"Times New Roman",serif;',
          )
          css = css.replace(
              '--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;',
              '--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;',
          )
          css_path.write_text(css, encoding='utf-8')

          patterns = [
              r'<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*',
              r'<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*',
              r'<link rel="stylesheet" href="https://fonts\.googleapis\.com/css2\?[^\"]+">\s*',
          ]
          for html_path in Path('.').glob('*.html'):
              html = html_path.read_text(encoding='utf-8')
              original = html
              for pattern in patterns:
                  html = re.sub(pattern, '', html)
              if html != original:
                  html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit transformed source once
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already repaired; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nova.css '*.html'
          git commit -m "perf: remove render-blocking remote fonts"
          git push origin HEAD:fix/nova-lighthouse-stability
