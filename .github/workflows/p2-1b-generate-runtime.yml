name: P2.1B Generate Canonical Runtime

on:
  push:
    branches:
      - refactor/p2-1b-foundation-consolidation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/p2-1b-foundation-consolidation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate canonical runtime bundle
        run: node scripts/p2-1b-consolidate-runtime.mjs

      - name: Validate generated diff
        run: |
          git diff --check
          test -s assets/nova-current-renderer.js
          test -s assets/nova-current.css
          grep -q 'canonical-foundation-bundle' assets/nova-current-renderer.js
          grep -q 'nova-current-renderer.js' app.html
          ! grep -q '<script src="assets/nova.js"' app.html
          ! grep -q '<link rel="stylesheet" href="assets/nova.css"' app.html

      - name: Commit generated runtime
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Canonical runtime already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html assets/nova-current-renderer.js assets/nova-current.css assets/legacy/p2-1a-canonical docs/uiux/runtime-manifest.p2-1b.json
          git commit -m "refactor: collapse historical Nova foundation runtime"
          git push origin HEAD:refactor/p2-1b-foundation-consolidation
